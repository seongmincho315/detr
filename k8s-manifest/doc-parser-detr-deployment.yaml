apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-parser-detr-deployment
  namespace: llmops
  labels:
    app: doc-parser-detr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: doc-parser-detr
  template:
    metadata:
      labels:
        app: doc-parser-detr
    spec:
      serviceAccountName: llmops
      containers:
        - name: doc-parser-detr
          image: mncregistry:30500/doc-parser-detr:0.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: Asia/Seoul
            - name: PROFILE
              value: prod
            - name: DEVICE
              value: cpu # GPU 노드에 올릴 때는 cuda로 바꾸고 아래 resources.limits 주석 해제
          volumeMounts:
            - name: nfs-root
              mountPath: /nfs-root
          # resources:
          #   limits:
          #     nvidia.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: nfs-root
          persistentVolumeClaim:
            claimName: llmops-nfs-root
        - name: license-volume
          secret:
            secretName: llmops-license
        - name: global-configmap
          configMap:
            name: llmops-global-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: doc-parser-detr-service
  namespace: llmops
  labels:
    app: doc-parser-detr
spec:
  selector:
    app: doc-parser-detr
  ports:
    - name: http
      port: 8080
      targetPort: 8080
